name: AAB CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - run: npx tsc --noEmit
      - run: CI=true npm test --prefix client -- --watch=false --runInBand
      - run: npm run build --prefix client
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dist
