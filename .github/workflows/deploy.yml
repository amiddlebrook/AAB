name: Cloudflare production
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Cloudflare authentication is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN. Check the GitHub repository and production environment secrets."
            exit 1
          fi
      - run: npm ci
      - run: npm ci --prefix client
      - run: npx tsc --noEmit
      - run: CI=true npm test --prefix client -- --watch=false --runInBand
      - run: npm run build --prefix client
      - name: Reuse or create Cloudflare D1 database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/aab-d1.json
          database_id="$(jq -r '[.[] | select(.name=="aab-db") | .uuid][0] // empty' /tmp/aab-d1.json)"
          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create aab-db
            npx wrangler d1 list --json > /tmp/aab-d1.json
            database_id="$(jq -r '[.[] | select(.name=="aab-db") | .uuid][0] // empty' /tmp/aab-d1.json)"
          fi
          if [[ ! "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Unable to resolve the D1 database ID for aab-db."
            exit 1
          fi
          sed -i -E "s/(database_id = \")[^\"]+(\")/\1${database_id}\2/" wrangler.toml
          echo "Using Cloudflare D1 database aab-db: $database_id"
      - name: Apply D1 schema
        run: npx wrangler d1 execute aab-db --remote --yes --file=./worker/schema.sql
      - name: Publish Worker and React assets
        run: npx wrangler deploy
      - name: Configure protected owner access
        shell: bash
        env:
          AAB_ADMIN_TOKEN: ${{ secrets.AAB_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${AAB_ADMIN_TOKEN:-}" ]]; then
            printf '%s' "$AAB_ADMIN_TOKEN" | npx wrangler secret put AAB_ADMIN_TOKEN
            echo "Synced existing GitHub owner token."
          elif npx wrangler secret list | jq -e 'any(.[]; .name == "AAB_ADMIN_TOKEN")' >/dev/null; then
            echo "Retaining existing Cloudflare owner token."
          else
            owner_token="$(openssl rand -hex 32)"
            printf '%s' "$owner_token" | npx wrangler secret put AAB_ADMIN_TOKEN
            ciphertext="$(printf '%s' "$owner_token" | openssl pkeyutl -encrypt -pubin -inkey .github/aab-owner-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
            echo "::notice::AAB_OWNER_ACCESS_CIPHERTEXT:$ciphertext"
            unset owner_token
            echo "Created one-time owner token; emitted only RSA-OAEP encrypted ciphertext for secure delivery."
          fi
      - name: Verify deployed application
        shell: bash
        run: |
          set -euo pipefail
          base="https://aab.averymiddlebrook2014.workers.dev"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$base/" | grep -qi '<div id="root">'
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$base/api/health" | jq -e '.status == "ok"' >/dev/null
          status="$(curl --silent --show-error --output /tmp/aab-auth.json --write-out '%{http_code}' "$base/api/frameworks")"
          if [[ "$status" != "401" ]]; then
            echo "::error::Expected protected /api/frameworks to return 401 without a token; received $status."
            cat /tmp/aab-auth.json
            exit 1
          fi
          echo "Live SPA, API health and owner protection verified at $base"

